<!doctype html>
<html>
<head>
  <title>selector kinds</title>
</head>
<body>
  <p id="one" class="item">first</p>
  <p id="two" class="item">second</p>
  <p id="three">third</p>
  <div id="host"></div>
  <script>
    var root = document.getElementById('host').attachShadow({mode: 'open'});
    root.innerHTML = '<span class="inner">inside</span>';
  </script>
</body>
</html>
